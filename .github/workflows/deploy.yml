name: Deploy VitePress site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Baidu World 2026 Beamer PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: baidu-world-2026.tex
          working_directory: docs/assets/beamer
          latexmk_use_xelatex: true
      - name: Stage Beamer PDF for VitePress
        run: |
          mkdir -p docs/public/files
          cp docs/assets/beamer/baidu-world-2026.pdf docs/public/files/baidu-world-2026-builder-seller.pdf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Prepare discussion configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-comments.mjs
      - name: Build
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
