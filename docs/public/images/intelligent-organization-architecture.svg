<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="智能组织参考架构：目标与治理、任务编排、Builder 构建者、AI 智能体、Seller 连接者、成果验收和反馈迭代">
<title>智能组织参考架构（简洁版）</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs>
<style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#151515}
.heading{font-size:38px;font-weight:700}
.main{font-size:31px;font-weight:700}
.sub{font-size:23px}
.note{font-size:19px;fill:#555}
.rect{fill:#fff;stroke:#333;stroke-width:2.5}
.accent{fill:#edf2f8;stroke:#333;stroke-width:2.5}
.line{fill:none;stroke:#555;stroke-width:2.8;marker-end:url(#a)}
.back{fill:none;stroke:#555;stroke-width:2.8;stroke-dasharray:10 8;marker-end:url(#a)}
</style>
<rect width="1200" height="760" fill="#fff"/>
<text x="600" y="58" class="heading" text-anchor="middle">智能组织：任务驱动的人机协作</text>
<rect class="rect" x="325" y="88" width="550" height="78" rx="5"/>
<text class="main" x="600" y="136" text-anchor="middle">目标与治理</text>
<path class="line" d="M600 167V207"/>
<rect class="accent" x="325" y="208" width="550" height="84" rx="5"/>
<text class="main" x="600" y="258" text-anchor="middle">任务拆解与协作调度</text>
<path d="M600 292V328H205V356 M600 328V356 M600 328H995V356" fill="none" stroke="#555" stroke-width="2.8"/>
<path class="line" d="M205 330V356"/>
<path class="line" d="M600 330V356"/>
<path class="line" d="M995 330V356"/>
<rect class="rect" x="30" y="356" width="350" height="126" rx="5"/>
<text class="main" x="205" y="402" text-anchor="middle">Builder 构建者</text>
<text class="sub" x="205" y="450" text-anchor="middle">创造产品、技术与方案</text>
<rect class="accent" x="425" y="356" width="350" height="126" rx="5"/>
<text class="main" x="600" y="402" text-anchor="middle">AI 智能体</text>
<text class="sub" x="600" y="450" text-anchor="middle">模型、工具、组织知识</text>
<rect class="rect" x="820" y="356" width="350" height="126" rx="5"/>
<text class="main" x="995" y="402" text-anchor="middle">Seller 连接者</text>
<text class="sub" x="995" y="450" text-anchor="middle">理解需求、沟通与信任</text>
<path d="M205 482V520H600 M600 482V520 M995 482V520H600" fill="none" stroke="#555" stroke-width="2.8"/>
<path class="line" d="M600 520V548"/>
<rect class="rect" x="325" y="549" width="550" height="82" rx="5"/>
<text class="main" x="600" y="599" text-anchor="middle">交付成果 · 验证与审批</text>
<path class="back" d="M325 590H85V248H325"/>
<text class="sub" x="97" y="546" text-anchor="start">反馈迭代</text>
<text class="note" x="600" y="700" text-anchor="middle">《AI时代指南》概念架构 · 非百度官方内部系统图</text>
</svg>